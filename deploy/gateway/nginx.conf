# Search gateway. Run from this folder: nginx -p . -c nginx.conf
#
# Public API (the only routes exposed):  GET /search   GET /books/{id}
# Internal endpoints (/health/*) are NOT exposed: Consul checks them directly on each Search.
# The upstream (search-upstream.conf) is generated by Consul Template with the Search
# instances whose /health/ready check is passing.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/json;

    # Keep the client's X-Request-Id (load generator) or create one; it is sent to the
    # backend, which logs it, so one request can be followed from client to Search.
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # One line per request. With a retry, upstream and upstream_status list every
    # backend tried (e.g. "a:7313, b:7314" and "503, 200").
    log_format  gateway  'ts=$time_iso8601 msec=$msec req=$req_id method=$request_method uri="$request_uri" '
                         'status=$status upstream="$upstream_addr" upstream_status="$upstream_status" '
                         'backend=$upstream_http_x_backend_id version=$upstream_http_x_index_version '
                         'request_s=$request_time upstream_s="$upstream_response_time"';
    access_log  logs/gateway.log  gateway;

    include  search-upstream.conf;

    server {
        listen  8080;

        proxy_set_header  X-Request-Id  $req_id;
        proxy_set_header  Host          $host;

        proxy_connect_timeout  1s;
        proxy_read_timeout     2s;

        # Retry on another Search if one is down, slow, or answers 503 (not ready / index
        # unavailable). Nginx does not retry 503 unless it is listed here.
        proxy_next_upstream          error timeout http_503;
        proxy_next_upstream_tries    2;
        proxy_next_upstream_timeout  3s;

        location = /search {
            proxy_pass  http://search_backend;
        }

        location ~ ^/books/[0-9]+$ {
            proxy_pass  http://search_backend;
        }

        location / {
            return  404  '{"error":"not_found","message":"only /search and /books/{id} are public"}';
        }
    }
}